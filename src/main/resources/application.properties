# ═══════════════════════════════════════════════════════════════
#  LangChain4j AI Chatbot — Application Configuration
# ═══════════════════════════════════════════════════════════════

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── Gemini API Key ────────────────────────────────────────────
# Set the GEMINI_API_KEY environment variable before starting:
#   Windows PowerShell : $env:GEMINI_API_KEY = "your_key_here"
#   Windows CMD        : set GEMINI_API_KEY=your_key_here
#   Linux / macOS      : export GEMINI_API_KEY=your_key_here
#
# Get your free API key at: https://aistudio.google.com
gemini.api.key=${GEMINI_API_KEY}

# ── AI Model Parameters ────────────────────────────────────────
#
# TEMPERATURE (0.0 – 2.0)
#   Controls randomness / creativity of AI responses.
#   0.1 = Very focused and deterministic (best for factual Q&A)
#   0.7 = Balanced creativity and accuracy (default — general chat)
#   1.5 = Highly creative, more varied (not ideal for factual tasks)
#
app.ai.temperature=0.7

#
# MAX OUTPUT TOKENS
#   Limits the length of the AI's response.
#   100  tokens ≈  75 words  (short answers)
#   512  tokens ≈ 385 words  (balanced — default)
#   1024 tokens ≈ 768 words  (long-form explanations)
#
app.ai.max-tokens=512

# ── Logging ────────────────────────────────────────────────────
logging.level.com.enterprise.chatbot=INFO
logging.level.dev.langchain4j=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Spring ────────────────────────────────────────────────────
spring.application.name=langchain4j-chatbot
spring.main.banner-mode=console
